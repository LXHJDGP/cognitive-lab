<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>认知实验室｜个人认知训练工作台</title>
<style>
:root{font-family:"Inter","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;color:#202339;background:#f6f7fb;font-size:15px;line-height:1.6;--ink:#202339;--muted:#5d647a;--line:#e2e5ef;--accent:#5941c5;--purple:#eeeaff;--rail:#19192d;--good:#176752;--bad:#942947}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-width:280px}
a{color:var(--accent);text-underline-offset:.2em}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.54}
:focus-visible{outline:3px solid #7958e9;outline-offset:3px}
[hidden]{display:none!important}
svg{width:20px;height:20px;display:block;flex:none}
.skip{position:fixed;z-index:9;top:8px;left:8px;padding:8px 14px;background:white;transform:translateY(-150%)}
.skip:focus{transform:none}
.layout{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:32px 16px 16px;background:var(--rail);color:#fff;z-index:2}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 35px}
.brand strong{display:block;font-size:17px;letter-spacing:.04em;line-height:1.4}
.brand small{color:#b7b4d1;font-size:10px;letter-spacing:.18em;font-weight:700}
.brand-mark{width:39px;height:39px;border-radius:11px;background:#7657eb;color:white;display:grid;place-items:center}
.brand-mark svg{width:23px;height:23px}
.rail nav{display:grid;gap:6px}
.rail button{background:transparent;color:#c3c3d9;border:1px solid transparent;width:100%;text-align:left;border-radius:9px;padding:10px 11px;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap}
.rail button:hover,.rail button[aria-current=page]{background:#30284f;border-color:#493970;color:#fbfaff}
.rail button[aria-current=page] svg{color:#c3b0ff}
.rail-bottom{margin-top:auto}
.local{display:flex;align-items:center;gap:8px;margin:17px 10px 5px;padding-top:14px;border-top:1px solid #39384f;color:#c3c3d9;font-size:12px}
.local i,.today i{width:7px;height:7px;background:#72d5bd;border-radius:50%;flex:none}
.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);padding:0 34px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:650}
.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.offline-download{white-space:nowrap;font-size:13px}
.today{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--muted);font-size:13px}
.today svg{width:17px;height:17px}
main{max-width:1440px;margin:auto;padding:25px 34px 38px}
main:focus{outline:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.3}
h1{font-size:clamp(27px,3vw,39px);letter-spacing:-.035em}
h2{font-size:21px;letter-spacing:-.01em}
h3{font-size:16px}
.page-heading{margin-bottom:20px}
.page-heading p,.lede{margin-top:6px;color:var(--muted)}
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:17px;color:white;background:linear-gradient(105deg,#272046,#37265c 64%,#49317b);padding:24px 27px;min-height:193px;display:grid;align-items:center;margin-bottom:17px}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#272046 4%,transparent 82%)}
.hero canvas{position:absolute;height:100%;width:min(66%,650px);right:0;top:0;z-index:-2}
.hero .eyebrow{color:#dbceff;margin-bottom:7px;display:flex;gap:6px;align-items:center}
.eyebrow svg{width:15px;height:15px}
.hero h2{font-size:clamp(23px,3vw,33px);letter-spacing:-.03em}
.hero p{color:#e6dbf9;margin:7px 0 14px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #d9ddec;border-radius:8px;padding:7px 12px;background:#fff;color:var(--ink);font-weight:650;min-height:38px;text-decoration:none;line-height:1.35}
.btn svg{width:16px;height:16px}
.btn:hover{background:#f3f0ff;border-color:#b5a8ec}
.primary{color:white;background:var(--accent);border-color:var(--accent)}
.primary:hover{color:white;background:#4930ae;border-color:#4930ae}
.hero .primary{background:white;color:#35216d;border-color:white}
.hero .primary:hover{background:#ece4ff}
.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.text-btn{color:var(--accent);font-weight:650;border:0;padding:4px;background:transparent}
.text-btn:hover{text-decoration:underline}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--accent)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);gap:15px}
.card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:17px;min-width:0}
.card-head,.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head{margin-bottom:11px}
.card-head h2{font-size:18px}
.plan-list{list-style:none;padding:0;margin:0}
.plan-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:11px;padding:9px 0;border-top:1px solid #edf0f6}
.plan-row strong,.module-name{display:block;font-size:14px;line-height:1.35}
.sub,.hint{color:var(--muted);font-size:12px}
.tile-icon{width:37px;height:37px;display:grid;place-items:center;border-radius:9px;background:var(--tint,#eeeaff);color:var(--tone,#5941c5);flex:none}
.tile-icon svg{width:19px;height:19px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats>div{min-width:0;padding:8px 8px 5px;border-radius:8px;background:#f6f5fc;font-variant-numeric:tabular-nums}
.stats strong{display:block;font-size:22px;line-height:1.28;overflow-wrap:anywhere}
.stats small{font-size:11px;color:var(--muted)}
.week-dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 8px}
.week-dots div{display:grid;text-align:center;gap:4px;font-size:11px;color:var(--muted)}
.week-dots b{height:24px;display:grid;place-items:center;border-radius:5px;background:#eff0f7;color:#51586d}
.week-dots b.done{background:#e6defd;color:#4b2fae}
.week-dots b.current{outline:1px solid #8772d4;outline-offset:1px}
.module-section{margin-top:16px}
.module-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.module-tile{display:grid;gap:6px;text-align:left;color:var(--ink);padding:12px;border:1px solid var(--line);background:#fff;border-radius:10px;align-content:start}
.module-tile:hover{border-color:#9883df;background:#fcfbff}
.module-tile .tile-icon{width:33px;height:33px}
.module-tile .sub{font-size:11px}
.wide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.stack{display:grid;gap:14px}
.prose{max-width:880px}
.prose p,.prose ul{margin:8px 0 0}
.prose ul{padding-left:22px}
.prose li+li{margin-top:5px}
.chips,.actions,.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.actions{margin-top:13px}
.chip{display:inline-flex;align-items:center;padding:2px 7px;background:#f0ecfe;color:#4a348f;border-radius:4px;font-size:11px;font-weight:700;line-height:1.6}
.chip.good{background:#e0f4ee;color:#176752}
.chip.neutral{background:#eef0f6;color:#555b71}
.row-gap{display:grid;gap:8px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field strong{color:var(--ink)}
input:not([type=checkbox]),textarea,select{min-width:0;width:100%;padding:8px 10px;background:#fff;color:var(--ink);border:1px solid #cbd0e1;border-radius:7px}
.filters .field{min-width:min(155px,100%)}
.compact{max-width:360px}
.check{display:flex;align-items:flex-start;gap:6px}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.training{max-width:860px;margin-inline:auto}
.train-head{margin-bottom:16px}
.clock,.numeric{font-family:"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.clock{font-size:17px;color:#4b378c}
.progress{height:5px;background:#ececf5;border-radius:9px;overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:#7455db}
.stage{padding:clamp(15px,3.2vw,32px);min-height:252px}
.stage h2{margin:5px 0 9px}
.stage p+p{margin-top:8px}
.stimulus{background:#f4f1ff;border:1px solid #e4dbff;border-radius:11px;text-align:center;color:#392774;font-size:64px;font-weight:750;padding:7px 10px;margin:14px 0;line-height:1.45}
.stimulus.small{font-size:clamp(24px,5vw,48px)}
.choice{font-size:15px;justify-content:flex-start;text-align:left}
.choice-grid{display:grid;gap:7px;margin-top:12px}
.choice-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.choice-row button{min-width:88px}
.choice-row .selected{background:#e6dcff;border-color:#7959df;opacity:1}
.feedback{border-left:4px solid #7970b9;background:#f4f2fb;padding:10px 13px;margin-top:12px;border-radius:5px;overflow-wrap:anywhere}
.feedback.correct{border-color:#198162;background:#ebf8f3}
.feedback.error{border-color:#a23952;background:#fdf0f2}
.stem,.focus-goal{padding:10px 13px;background:#f6f7fb;border-radius:7px;margin:8px 0 12px;overflow-wrap:anywhere}
.steps{padding-left:24px;margin:10px 0}
.steps li+li{margin-top:5px}
.countdown{font-size:clamp(42px,8vw,78px);font-weight:750;line-height:1.35;color:#3d2c7b;margin:10px 0}
.train-controls{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
th,td{border-bottom:1px solid #e9eaf3;padding:8px 9px;vertical-align:top}
th{color:var(--muted);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.bars{height:139px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:end;gap:7px;margin:10px 0}
.bar-item{text-align:center;display:grid;grid-template-rows:15px 95px 18px;gap:3px;font-size:11px;color:var(--muted)}
.bar-track{height:95px;background:#f3f1fb;display:flex;align-items:flex-end;justify-content:center;border-radius:7px;overflow:hidden}
.bar-track i{width:100%;display:block;background:#8264e0;border-radius:6px 6px 0 0}
.bar-caption{margin-top:5px;color:var(--muted);font-size:12px}
.empty{border:1px dashed #d9d9e9;border-radius:8px;padding:16px;color:var(--muted)}
details summary{cursor:pointer;font-weight:650}
details .table-wrap{margin-top:7px}
.storage-alert{margin:14px 34px 0;border:1px solid #e1c37e;background:#fff4d9;color:#523d0f;padding:8px 13px;border-radius:7px;font-size:13px}
#toast:not(:empty){position:fixed;bottom:19px;right:19px;z-index:5;background:#292043;color:white;padding:9px 15px;border-radius:7px;max-width:min(380px,90vw);box-shadow:0 4px 18px #17102b30}
dialog{border:1px solid var(--line);border-radius:13px;color:var(--ink);width:min(440px,calc(100% - 26px));padding:20px}
dialog::backdrop{background:#15112690}
@media(max-width:1050px){.layout{grid-template-columns:187px minmax(0,1fr)}.rail{padding-inline:12px}main,.topbar{padding-inline:22px}.storage-alert{margin-inline:22px}.module-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.layout{display:block}.rail{height:auto;position:static;padding:11px 12px;display:grid;gap:8px}.brand{padding:0}.brand-mark{width:31px;height:31px}.brand-mark svg{width:18px;height:18px}.rail nav{display:flex;flex-wrap:wrap;gap:3px}.rail button{width:auto;font-size:12px;padding:5px 6px;gap:4px}.rail button svg{width:14px;height:14px}.rail-bottom{display:flex;align-items:center;gap:5px}.local{margin:0 0 0 6px;padding:0;border:0;font-size:10px}.topbar{height:44px}.topbar,main{padding-inline:13px}.storage-alert{margin-inline:13px}main{padding-top:15px}.dash-grid{grid-template-columns:1fr}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px 15px}.hero canvas{opacity:.58}.hero::after{background:linear-gradient(90deg,#272046 15%,transparent 100%)}}
@media(forced-colors:active){.bar-track i,.progress span{background:Highlight}.week-dots b.done{outline:2px solid Highlight}}
@media(max-width:430px){.top-actions:has(.offline-download:not([hidden])) .today{display:none}}

</style>

<script>
'use strict';
const modules = {
  update:{name:'工作记忆更新',icon:'update',tint:'#eee9ff',tone:'#5d40bd',group:'实验任务改编',desc:'持续跟踪最近出现的信息。',modes:{nback:'字母 N-back',running:'滚动记忆'}},
  span:{name:'复杂跨度',icon:'span',tint:'#e8efff',tone:'#2857a1',group:'实验任务改编',desc:'交替进行算式判断与字母记忆。',modes:{ospan:'操作广度 · Operation Span'}},
  math:{name:'渐隐式数学推导',icon:'math',tint:'#e5f5f1',tone:'#176d5d',group:'教学方法',desc:'先读完整示范，再逐步独立求解。',modes:{linear:'一元方程',function:'一次函数',sequence:'等差数列',probability:'不放回抽样'}},
  reason:{name:'连续推理链',icon:'reason',tint:'#fff0dc',tone:'#844d16',group:'领域练习',desc:'按顺序连接前提、中间结论和最终结论。',modes:{rules:'条件规则',sets:'集合包含',order:'先后约束'}},
  focus:{name:'单任务注意练习',icon:'focus',tint:'#fceaf2',tone:'#91385e',group:'实践策略',desc:'专注于一个真实任务，记录走神和恢复线索。',modes:{focus:'单任务计时'}}
};
const focusTimes = [5,8,12];
const judgmentSeconds = [9,8,7];
const nbackSeconds = [2.8,2.8,2.8];
const firstMode = id => Object.keys(modules[id].modes)[0];
const focusMinutes = level => focusTimes[level-1];
const distractors = ['走神','外界打断','主动切换','页面隐藏','手动暂停'];
const groups = {main:'作答',judgment:'算式判断',recall:'位置回忆',target:'匹配试次',other:'不匹配试次',supported:'补全步骤',independent:'独立题'};
const sum = (list, selector) => list.reduce((total,item) => total + selector(item),0);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const displayClock = seconds => `${pad(Math.floor(seconds/60))}:${pad(seconds%60)}`;
const displayMinutes = seconds => seconds ? ((seconds/60).toFixed(1)+' 分钟') : '0 分钟';
const percent = value => value == null ? '—' : Math.round(value*100)+'%';
function day(date = new Date()) {
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
}
function shiftDay(key, offset) {
  const [year,month,date] = key.split('-').map(Number);
  return day(new Date(year,month-1,date+offset,12));
}
function weekday(key) {
  const [year,month,date] = key.split('-').map(Number);
  return new Date(year,month-1,date,12).getDay();
}
const monday = key => shiftDay(key,-((weekday(key)+6)%7));
const validDay = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value) && shiftDay(value,0) === value;
const spanDays = key => Array.from({length:7},(_,i)=>shiftDay(key,i));
function tally(items) {
  const correct = items.filter(item=>item.result==='correct').length;
  const omissions = items.filter(item=>item.result==='omission').length;
  return {total:items.length,correct,omissions,errors:items.length-correct-omissions,accuracy:items.length ? correct/items.length : null};
}
const taskTally = (record,...types) => tally(record.items.filter(item=>types.includes(item.kind)));
const timestamp = () => new Date().toISOString();
function random(seed) {
  let state = seed >>> 0;
  return () => {
    state = (state + 0x6D2B79F5) >>> 0;
    let value = Math.imul(state ^ state>>>15, 1|state);
    value ^= value + Math.imul(value ^ value>>>7,61|value);
    return ((value ^ value>>>14) >>> 0)/4294967296;
  };
}
const newSeed = () => Math.floor(Math.random()*4294967296);
const int = (rng,min,max) => min + Math.floor(rng()*(max-min+1));
const pick = (rng,values) => values[int(rng,0,values.length-1)];
function shuffle(rng,values) {
  const copy = [...values];
  for (let i=copy.length-1;i>0;i--) {
    const j = int(rng,0,i);
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}
const alphabet = [...'FHKLMNPRSTVY'];
function nbackBank(rng,level) {
  const n = level;
  const targets = new Set(shuffle(rng,Array.from({length:20},(_,i)=>i+n)).slice(0,7));
  const letters = [];
  for (let i=0;i<20+n;i++) {
    const previous = letters[i-n];
    const lure = letters[i-(n+1)];
    const letter = targets.has(i) ? previous :
      lure && lure !== previous && rng() < .25 ? lure :
      pick(rng,alphabet.filter(value=>value!==previous));
    letters.push(letter);
  }
  return letters.map((letter,index)=>({letter,lookback:letters[index-n],target:index>=n && letter===letters[index-n]}));
}
function runningBank(rng,level) {
  const count = level+2;
  return [0,1,2].map(()=> {
    const length = int(rng,count+2,count+7);
    const stream = Array.from({length},(_,index)=>index);
    for (let i=0;i<length;i++) stream[i] = pick(rng,[...'123456789'].filter(x=>x!==stream[i-1]));
    return {stream,answer:stream.slice(-count),choices:[...'123456789']};
  });
}
function operationBank(rng,level) {
  return Array.from({length:3},(_,index)=>{
    const length = level+1+index;
    const answer = shuffle(rng,alphabet).slice(0,length);
    const truth = shuffle(rng,Array.from({length},(_,i)=>i%2===0));
    const problems = answer.map((letter,i)=>{
      const a=int(rng,2,8), b=int(rng,2,7), c=int(rng,1,9);
      const add = rng() < .5;
      const useProduct = level>1 || rng()<.5;
      const base = useProduct ? a*b : a+b;
      const value = add ? base+c : base-c;
      const proposed = value+(truth[i]?0:pick(rng,[-3,-2,-1,1,2,3]));
      const left = `(${a} ${useProduct?'×':'+'} ${b}) ${add?'+':'−'} ${c}`;
      return {letter,statement:`${left} = ${proposed}`,value,truth:truth[i]};
    });
    return {answer,problems,choices:alphabet};
  });
}
const step = (label,answer,why) => ({label,answer:String(answer),why});
const signed = value => value<0 ? `− ${-value}` : `+ ${value}`;
function mathCase(rng,level,mode) {
  const a=int(rng,2,level===1?5:9), b=int(rng,2,9), x=int(rng,2,15)*(level>1 && rng()<.35?-1:1);
  if (mode==='linear') {
    const offset=level>1 && rng()<.5?-b:b;
    const c=level===1?0:int(rng,1,a-1);

  if (s.phaseEnds!==null && msNow()>=s.phaseEnds) {
    const current=s.bank[s.index];

      if (s.index>=s.level) {

        answerItem(current.target?'target':'other',`第 ${s.index-s.level+1} 个试次 · ${current.letter}`,
          current.target?'相同':'不同',text(s.phaseResponse),nbackExplanation(s.level,current.lookback,current.letter));

      phase(s,'nback',nbackSeconds[s.level-1]);
    } else if (s.phase==='digit') {

  return `${heading('每周复盘','对照表现、耗时和主观用力，找出下周想练的一件事。')}
  <div class="stack"><div class="flex-between">${button('← 上一周','week','data-value="-7"')}<strong>${reviewWeek} 至 ${end}</strong>
  ${button('下一周 →','week',`data-value="7" ${reviewWeek>=current?'disabled':''}`)}</div>
  <div class="dash-grid"><section class="card"><div class="card-head"><h2>有效训练时长</h2></div>
  <div class="bars" role="list" aria-label="本周逐日有效时长">${perDay.map((v,i)=>`<div class="bar-item" role="listitem" aria-label="${days[i]} ${v.toFixed(1)} 分钟">
    <strong>${v.toFixed(1)}</strong><div class="bar-track" aria-hidden="true"><i style="height:${v/max*100}%"></i></div><span>周${'一二三四五六日'[i]}</span></div>`).join('')}</div><p class="hint">单位为分钟，含提前结束的练习与单任务时段。</p></section>
  <section class="card"><div class="card-head"><h2>本周完成情况</h2></div><div class="stats"><div><strong>${uniqueDays(sessions)}<small> / ${db.settings.weeklyGoal}</small></strong><small>训练天数</small></div>
    <div><strong>${sessions.length}</strong><small>完整场次</small></div><div><strong>${a.effort===null?'—':a.effort.toFixed(1)}</strong><small>平均用力 / 5</small></div></div>
    ${weekStrip(reviewWeek,week)}<p class="hint">本周共记录 ${a.events} 次中断／暂停。单任务 ${focus.length} 场，${focus.filter(r=>r.outcome==='done').length} 场达成自定目标。</p></section></div>
  <section class="card"><div class="card-head"><h2>与上周对照</h2></div>
    <p class="hint">对照的是同题型、同难度且练到结束的场次，记录过中断或暂停的场次不纳入。若本周还没结束，对照上周一到同一星期几。正确率等于答对数除以计分项目总数，超时未答和主动跳过都计为漏答。</p>
    ${rows?`<div class="table-wrap"><table><thead><tr><th scope="col">题型 · 难度</th><th scope="col">场次（本 / 上）</th><th scope="col">正确率（本 / 上）</th><th scope="col">差值</th><th scope="col">错 / 漏（本周）</th><th scope="col">场均时长（本周）</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`:empty('本周暂无符合对照条件的计分场次。')}</section>
  <section class="card"><div class="card-head"><h2>复盘笔记</h2></div><form id="review-form" class="row-gap">
    <label class="field"><strong>下周准备练什么？</strong><textarea name="note" maxlength="1200" rows="3" placeholder="例：做方程时，先写出移项后的系数，再核对符号。">${esc(notes)}</textarea></label>
    <div><button class="btn primary" type="submit">保存本周笔记</button></div></form></section>
  </div>`;
}
const citation = (title,url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${title}</a>`;
function science() {
  return `${heading('科学依据','怎么看练习成绩，以及每种方法适用的范围。')}<div class="stack prose">
  <section class="card"><h2>练习表现与迁移</h2><p>正确率、速度和漏答反映你在当前任务与条件下的表现。熟悉题型或采用新策略也会提高成绩。研究对一般智力和日常认知能力的远迁移缺乏稳健支持，本工作台只报告练习数据。</p>
  <p>${citation('Redick 等（2013）随机、安慰剂对照研究','https://pubmed.ncbi.nlm.nih.gov/22708717/')} ·
  ${citation('Melby-Lervåg 等（2016）元分析','https://pmc.ncbi.nlm.nih.gov/articles/PMC4968033/')}</p></section>
  <section class="card"><div class="chips">${chip('实验任务改编')}</div><h2>工作记忆更新与复杂跨度</h2>
  <p>字母 N-back 用当前字母与 N 个位置之前的字母做比较，1-back 就是比较上一个字母。滚动记忆要求在一串未知长度的数字结束后，依出现顺序回忆最后几个数。操作广度交替安排等式判断和字母记忆，两项分别计分。工作台采用简化流程和固定作答时限，成绩用于个人练习对照。</p>
  <p>${citation('Kirchner（1958）早期 N-back 任务','https://pubmed.ncbi.nlm.nih.gov/13539317/')} ·
  ${citation('Pollack 等（1959）滚动记忆实验','https://pubmed.ncbi.nlm.nih.gov/13641585/')} ·
  ${citation('Unsworth 等（2005）自动化操作广度','https://doi.org/10.3758/BF03192720')}</p></section>
  <section class="card"><div class="chips">${chip('教学方法')}</div><h2>渐隐式数学推导</h2><p>本模块用一题示范、两题补全和一题独立解题，帮助熟悉同类题的解题程序。补全步骤和独立结果分别统计。教学研究关注所学内容的掌握及其应用。</p>
  <p>${citation('Renkl 等（2002）从例题到独立解题的研究','https://doi.org/10.1080/00220970209599510')}</p></section>
  <section class="card"><div class="chips">${chip('领域练习')}</div><h2>连续推理链</h2><p>练习应用条件蕴涵、集合包含与顺序传递，每步都可核对前提。题目和自适应规则为工作台设计，分数描述这些题型中的推导表现。</p></section>
  <section class="card"><div class="chips">${chip('实践策略')}</div><h2>单任务注意练习</h2><p>给真实任务设定一个目标和时段，遇到打断时写下恢复线索。任务切换与恢复计划研究为这一设计提供线索。时长、中断次数和目标完成度由你结合实际任务解释。</p>
  <p>${citation('Leroy（2009）任务切换中的注意残留','https://doi.org/10.1016/j.obhdp.2009.04.002')} ·
  ${citation('Leroy 与 Glomb（2018）恢复计划研究','https://doi.org/10.1287/orsc.2017.1184')}</p></section>
  <section class="card"><h2>自适应怎么运作</h2>
  <p>系统查看同题型最近两次练到结束、且未记过中断或暂停的记录。只有这两次难度相同，才会判断是否调级。两次得分都至少为 80%，且填过的用力评分都不超过 3，就上调一级。两次得分都低于 60%，就下调一级。N-back 分别统计应答「相同」和应答「不同」的题，取较低的正确率。操作广度同样取等式判断与字母回忆中较低的一项。数学看独立题结果。</p>
  <p>单任务只用默认时段、计时结束且未记过中断或暂停的记录。最近两次难度相同，目标都达成且用力评分都不超过 3，才会延长默认时段。两次用力评分都至少为 4 时缩短。自订时段照常保存到历史。你可在开始前手动选择 1–3 级。</p>
  <p class="hint">以上阈值是应用的练习安排规则。研究链接需联网，练习、记录和复盘均可离线使用。</p></section></div>`;
}
function data() {
  return `${heading('设置与备份','在这台电脑上管理你的练习档案。')}<div class="stack prose">
  <section class="card"><h2>训练设置</h2><p>默认周一至周五提供计划，周末可自选。周目标用于显示进度。</p>
    <form id="settings-form" class="row-gap" style="margin-top:10px"><label class="field compact"><strong>每周训练天数目标</strong>
    <select name="weeklyGoal">${[1,2,3,4,5,6,7].map(n=>option(n,n+' 天',db.settings.weeklyGoal)).join('')}</select></label>
    <div><button class="btn primary" type="submit">保存设置</button></div></form></section>
  <section class="card"><h2>备份与恢复</h2><p>当前档案有 ${db.records.length} 场训练和 ${Object.keys(db.reviews).length} 篇复盘笔记。上次发起 JSON 下载：${db.settings.lastBackup||'尚未导出'}。</p>
    <p>JSON 包含完整记录、逐题解析、设置和复盘笔记，可导入恢复。CSV 提供逐场汇总，可在 Excel 查看。</p>
    <div class="actions">${button('下载 JSON 备份','export-json','','primary')}${button('导出 CSV','export-csv')}${button('导入 JSON','select-file')}</div>
    <input type="file" id="backup-file" accept=".json,application/json" hidden>
    <p class="hint">导入会合并历史。若两份场次记录的编号相同，或笔记属于同一周，保留当前档案里的版本。</p></section>
  <section class="card"><h2>让数据长期可用</h2><ul>
    <li>把 HTML 文件放在固定文件夹，每次用同一个浏览器及其同一个用户配置打开。</li>
    <li>浏览器保存训练数据，HTML 文件是程序。每周下载一份 JSON，确认文件已经保存，再复制到你常用的备份位置。</li>
    <li>移动文件、更换浏览器或清理浏览器数据前先下载 JSON。在新位置打开程序，然后导入。</li>
    <li>存储无法写入时，页面会提示导出。请在关闭页面前立即下载 JSON，保留独立备份。</li>
  </ul></section></div>`;
}
function download(name,body,mime) {
  const url=URL.createObjectURL(new Blob([body],{type:mime}));
  const a=document.createElement('a');
  a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function exportJson() {
  const key=day();
  commit(base=>({...base,settings:{...base.settings,lastBackup:key}}));
  download(`认知实验室备份-${key}.json`,JSON.stringify(db),'application/json;charset=utf-8');
  if (page==='data') render(false);
  toast('已发起 JSON 下载。请到浏览器的下载记录确认。');
}
function csvCell(value) {
  let text=String(value??'');
  if (typeof value==='string' && /^[\s]*[=+\-@]|^[\t\r\n]/.test(text)) text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
}
function exportCsv() {
  refreshStorage();
  const cols=['日期','开始时间（UTC）','模块','题型','难度','场次状态','有效秒数','计分项目','正确','错误','漏答','正确率','用力 1–5','中断及暂停','目标分钟','目标','目标结果','恢复线索','备注','记录编号'];
  const rows=sorted(db.records).map(r=>{
    const t=tally(r.items);
    return [r.date,r.start,modules[r.module].name,modeName(r.module,r.mode),r.level,r.complete?'完成':'提前结束',r.seconds,
      r.module==='focus'?'':t.total,r.module==='focus'?'':t.correct,r.module==='focus'?'':t.errors,r.module==='focus'?'':t.omissions,
      t.accuracy===null?'':percent(t.accuracy),r.effort,r.events.length,r.target||'',r.goal,outcomeLabels[r.outcome]||'',r.cue,r.note,r.id];
  });
  download(`认知实验室记录-${day()}.csv`,'\uFEFF'+[cols,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');
  toast('已发起 CSV 下载。');
}
function confirmBox(title,body,label,onConfirm) {
  const dialog=document.createElement('dialog');
  dialog.setAttribute('aria-labelledby','dialog-title');
  dialog.innerHTML=`<h2 id="dialog-title">${title}</h2><form method="dialog"><div class="row-gap" style="margin-top:9px">${body}</div>
    <div class="actions"><button class="btn" value="cancel" autofocus>取消</button><button class="btn primary" value="confirm">${label}</button></div></form>`;
  document.body.append(dialog);
  dialog.addEventListener('close',()=>{
    const confirmed=dialog.returnValue==='confirm';
    if (confirmed) onConfirm(dialog);
    dialog.remove();
  },{once:true});
  dialog.showModal();
}
async function importJson(file) {
  try {
    if (file.size>30*1024*1024) throw new Error('备份文件超过 30 MB。');
    const imported=sanitizeDb(JSON.parse((await file.text()).replace(/^\uFEFF/,'')));
    if (page!=='data' || document.querySelector('dialog[open]')) return;
    refreshStorage();
    const existing=new Set(db.records.map(r=>r.id));
    const extra=imported.records.filter(r=>!existing.has(r.id)).length;
    const fresh=db.records.length===0 && Object.keys(db.reviews).length===0;
    confirmBox('导入训练档案',`<p>文件包含 ${imported.records.length} 场训练，预计新增 ${extra} 场，另有 ${Object.keys(imported.reviews).length} 篇复盘笔记。</p>
      <label class="check"><input id="restore-settings" type="checkbox" ${fresh?'checked':''}>使用备份中的每周目标</label>`,'合并导入',dialog=>{
      const restore=dialog.querySelector('#restore-settings').checked;
      const saved=commit(base=>({...base,records:mergeRecords(imported.records,base.records),reviews:{...imported.reviews,...base.reviews},
        settings:restore?{...base.settings,weeklyGoal:imported.settings.weeklyGoal}:base.settings}));
      render();
      toast(saved?'档案已合并到浏览器存储。':'档案已合并到当前页面。请再次导出以保留合并结果。');
    });
  } catch(error) {
    toast(error instanceof SyntaxError?'文件无法解析，请选择工作台导出的 JSON 备份。':error.message);
  }
}
document.addEventListener('click',event=>{
  const control=event.target.closest('button[data-go],button[data-action]');
  if (!control || control.disabled) return;
  if (control.dataset.go) {
    if (session) {toast('请先结束当前训练并保存记录。');return;}
    go(control.dataset.go);
    return;
  }
  const {action,module:id,mode,level,value,index}=control.dataset;
  if (action==='prepare') {
    const chosen=Number(level)||recommended(db.records,id,mode);
    setup={id,mode,level:chosen,goal:'',duration:focusMinutes(chosen)};
    go('setup');
  } else if (action==='binary') respond(value);
  else if (action==='recall' && isActive()) recall(value);
  else if (action==='reason' && isActive()) answerStep(session.bank[session.index].steps[session.part].options[Number(index)]);
  else if (action==='skip-answer' && isActive()) answerStep('');
  else if (action==='advance' && isActive()) advance();
  else if (action==='pause') pauseSession('手动暂停');
  else if (action==='interruption') pauseSession('外界打断');
  else if (action==='stop' && session) {
    tick();
    if (!session.finished) finish(false);
  } else if (action==='discard') {
    confirmBox('放弃这场训练？','<p>放弃后，本场作答和备注会从当前页面清除。</p>','放弃记录',()=>{
      session=null;
      go('home');
    });
  } else if (action==='week') {
    reviewWeek=shiftDay(reviewWeek,Number(value));
    render();
  } else if (action==='h-page') {
    filters.hPage+=Number(value);
    render(false);
  } else if (action==='export-json') exportJson();
  else if (action==='export-csv') exportCsv();
  else if (action==='select-file') document.getElementById('backup-file').click();
});
document.addEventListener('input',event=>{
  if (session && event.target.matches('#math-form input[name="answer"]')) session.answerDraft=event.target.value;
});
document.addEventListener('toggle',event=>{
  if (session && event.target.id==='premises' && event.target.isConnected) session.showPremises=event.target.open;
},true);
document.addEventListener('change',event=>{
  const field=event.target;
  if (field.id==='level' && setup) {
    setup.level=Number(field.value);
    if (setup.id==='focus') field.form.elements.duration.value=String(focusMinutes(setup.level));
  } else if (field.dataset.filter) {
    const name=field.dataset.filter;
    filters[name]=field.value;
    if (name==='module') filters.mode=firstMode(field.value);
    if (name.startsWith('h')) filters.hPage=0;
    render(false);
    main.querySelector(`[data-filter="${name}"]`).focus();
  } else if (field.id==='backup-file') {
    const file=field.files[0];
    field.value='';
    if (file) void importJson(file);
  }
});
document.addEventListener('submit',event=>{
  const form=event.target;
  if (!form.id) return;
  event.preventDefault();
  const values=new FormData(form);
  if (form.id==='start-form') begin(values);
  else if (form.id==='math-form' && isActive()) {
    const raw=String(values.get('answer')).trim();
    if (readNumber(raw)===null) {toast('请输入有效数字或分数，例如 −4 或 3/8。');return;}
    answerStep(raw);
  } else if (form.id==='event-form' && isActive()) {
    tick();
    if (!isActive()) return;
    recordEvent(String(values.get('kind')),String(values.get('cue')).trim());
    render(false);
    document.querySelector('#event-form button').focus();
  } else if (form.id==='resume-form' && session?.paused) {
    const cue=String(values.get('cue')).trim();
    if (cue && session.events.length) {
      session.cue=cue;
      session.events.at(-1).cue=cue;
    }
    resumeSession();
  } else if (form.id==='save-form' && session?.finished) saveSession(values);
  else if (form.id==='review-form') {
    const note=String(values.get('note')).trim();
    const saved=commit(base=>{
      const reviews={...base.reviews};
      if (note) reviews[reviewWeek]=note;
      else delete reviews[reviewWeek];
      return {...base,reviews};
    });
    toast(saved?'本周笔记已保存。':'本周笔记已暂存，请导出备份。');
  } else if (form.id==='settings-form') {
    const saved=commit(base=>({...base,settings:{...base.settings,weeklyGoal:Number(values.get('weeklyGoal'))}}));
    toast(saved?'训练设置已保存。':'训练设置已暂存，请导出备份。');
  }
});
render(false);

</script>
